<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Cats">
<title>Math Cats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#5a4e3a; --muted:#8b7e6a; --faint:#b8a88a; --line:#e0d4c0; --soft:#f0e6d3;
  --orange:#e67e22; --orange2:#f39c12; --red:#e74c3c; --green:#44bd60; --teal:#4ecdc4; --purple:#6c5ce7;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
body{font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fef9ef 0%,#fdf2e0 40%,#fce8cc 100%);display:flex;justify-content:center}
button{font-family:inherit;-webkit-appearance:none;cursor:pointer}
#app{width:100%;max-width:540px;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}

/* nav */
.nav{display:flex;gap:4px;margin-bottom:8px;flex-shrink:0}
.nav-btn{flex:1;padding:8px 2px;border:none;border-radius:12px;font-size:14px;font-weight:600;background:transparent;color:var(--faint);transition:all .2s}
.nav-btn.active{background:white;color:var(--orange);box-shadow:0 2px 8px rgba(0,0,0,.06)}
body.zooming .nav,body.zooming .mode-toggle,body.zooming #zoomBtn{opacity:.35;pointer-events:none}
.page{display:none;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;flex-direction:column;-webkit-overflow-scrolling:touch}
.page.active{display:flex}
.page::-webkit-scrollbar{display:none}
.inner{display:flex;flex-direction:column;gap:12px;padding-bottom:24px}

/* top bar */
.top-bar{display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-shrink:0}
.pill{background:white;border:2px solid var(--line);border-radius:12px;padding:4px 9px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.spacer{flex:1}
.icon-btn{background:white;border:2px solid var(--line);border-radius:12px;padding:4px 9px;font-size:15px;color:var(--muted);white-space:nowrap}
.zoom-btn{background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:white;border:none;font-weight:700;box-shadow:0 3px 0 #4b3fb8;padding:6px 10px}
.gear{position:relative;overflow:hidden}
.gear::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--orange)}
.gear.holding::after{width:100%;transition:width 1.2s linear}
.streak-badge{position:absolute;right:6px;top:6px;z-index:5;display:none;align-items:center;gap:3px;background:linear-gradient(135deg,#ff6b35,#ff9a56);border-radius:14px;padding:3px 8px;box-shadow:0 2px 8px rgba(255,107,53,.3);color:white;font-weight:700;font-size:calc(12px*var(--k));white-space:nowrap}
.streak-badge.visible{display:flex}

.mode-toggle{display:flex;gap:3px;flex-shrink:0}
.mode-btn{padding:4px 8px;border:2px solid var(--line);border-radius:11px;background:white;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.mode-btn .lbl,.zoom-btn .lbl{display:none}
@media (min-width:620px){.mode-btn .lbl,.zoom-btn .lbl{display:inline}}
.mode-btn.active{border-color:var(--orange);background:linear-gradient(135deg,#ffecd2,#fcb69f);color:#c0392b}

/* scene */
.scene{--k:1;position:relative;height:calc(150px*var(--k));background:linear-gradient(#fff8ec,#fdebd0);border:2px solid var(--soft);border-radius:18px;margin-bottom:6px;overflow:hidden;flex-shrink:0}
.window{position:absolute;right:8%;top:calc(14px*var(--k));width:calc(70px*var(--k));height:calc(52px*var(--k));border-radius:8px;background:linear-gradient(#bfe3ff,#e6f4ff);border:4px solid #fff;box-shadow:0 0 0 2px #e8d9c0}
.window::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff;transform:translateX(-50%)}
.table-top{position:absolute;left:4%;width:52%;top:calc(100px*var(--k));height:calc(10px*var(--k));background:#a0703c;border-radius:4px}
.table-leg{position:absolute;top:calc(110px*var(--k));bottom:calc(24px*var(--k));width:calc(8px*var(--k));background:#8a5d2f}
.table-leg.l{left:7%}.table-leg.r{left:51%}
.knock-obj{position:absolute;top:calc(65px*var(--k));left:33%;font-size:calc(32px*var(--k));line-height:calc(36px*var(--k));transition:left .35s ease;z-index:2}
.buddy-wrap{position:absolute;left:5%;top:calc(12px*var(--k));width:calc(90px*var(--k));height:calc(90px*var(--k));z-index:3}
.buddy-wrap.zoom{top:calc(36px*var(--k));animation:zoomLap 1.3s linear infinite}
.buddy-wrap.zoom canvas{animation:bob .16s ease-in-out infinite alternate}
@keyframes zoomLap{0%{left:2%;transform:scaleX(1)}48%{left:78%;transform:scaleX(1)}50%{left:78%;transform:scaleX(-1)}98%{left:2%;transform:scaleX(-1)}100%{left:2%;transform:scaleX(1)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.dog{position:absolute;right:6%;bottom:calc(18px*var(--k));display:none;text-align:center;z-index:2}
.dog.show{display:block}
.dog-emoji{font-size:calc(54px*var(--k));line-height:1;transform:scaleX(-1)}
.dog-hp{font-size:calc(11px*var(--k));letter-spacing:-1px;margin-bottom:2px}
.scene-msg{position:absolute;left:50%;transform:translateX(-50%);top:6px;max-width:92%;text-align:center;background:rgba(255,255,255,.92);border-radius:12px;padding:3px 10px;font-weight:700;font-size:calc(13px*var(--k));color:var(--orange);pointer-events:none;opacity:0;transition:opacity .3s;z-index:4;text-shadow:0 1px 0 white,0 -1px 0 white,1px 0 0 white,-1px 0 0 white}
.scene-msg.show{opacity:1}
.zoom-timer{position:absolute;left:0;right:0;top:0;height:6px;background:rgba(0,0,0,.08);display:none;z-index:5}
#zoomFill{height:100%;width:100%;background:linear-gradient(90deg,#a29bfe,#6c5ce7)}
.fx{position:absolute;pointer-events:none;z-index:6;line-height:1}

/* meter (lives in the floor of the scene) */
.meter{position:absolute;left:0;right:0;bottom:0;height:calc(24px*var(--k));background:#e2c9a0;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:1}
.meter.full{background:#d9b47c;animation:rumble .4s infinite}
.meter-label{font-size:calc(12px*var(--k));color:#7a6346;white-space:nowrap;font-weight:700}
.pips{display:flex;flex:1;justify-content:space-between;max-width:calc(260px*var(--k))}
.pip{font-size:calc(14px*var(--k));filter:grayscale(1);opacity:.28;transition:all .3s}
.pip.full{filter:none;opacity:1}
@keyframes rumble{0%,100%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}

/* card */
.card{background:white;border-radius:20px;padding:10px;margin-bottom:6px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:2px solid var(--soft);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;flex:1 1 auto}
.card.compact .reward-traits,.card.compact .reward-extra{display:none}
.card.compact .mini-btn{margin-top:2px;padding:2px 8px}
.card.shake{animation:shake .4s ease}
.play-view{display:flex;flex-direction:column;align-items:center}
.equation{font-size:var(--eq,46px);font-weight:700;display:flex;align-items:center;gap:.18em;animation:float 3s ease-in-out infinite;line-height:1.1}
.equation .op{color:var(--orange);font-size:.74em}
.equation .eq{color:var(--faint);font-size:.74em}
.equation .q{color:var(--orange);font-size:.74em}
.answer-display{margin-top:.2em;font-size:var(--ans,38px);font-weight:700;min-height:1.2em;line-height:1.2;text-align:center;border-bottom:3px solid var(--line);min-width:2.6em;padding:0 8px;transition:border-color .3s,color .3s}
.answer-display.wrong{color:var(--red);border-color:var(--red)}
.answer-display.right{color:var(--green);border-color:var(--green)}
.placeholder{color:#ddd}
.feedback{margin-top:6px;font-size:14px;font-weight:500;min-height:18px;text-align:center;color:var(--red)}
.feedback.hint{color:var(--purple)}
.reward{position:relative;z-index:1;text-align:center}
.reward-container{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
.reward-name{font-weight:700;font-size:15px;margin-top:2px}
.reward-traits{font-size:10px;color:var(--faint);margin-top:2px}
.reward-msg{margin-top:4px;font-size:17px;font-weight:600;color:var(--orange)}
.reward-eq{margin-top:2px;font-size:14px;color:var(--muted)}
.reward-extra{margin-top:2px;font-size:12px;color:var(--muted)}
.mini-btn{margin-top:6px;border:2px solid var(--line);background:white;border-radius:10px;padding:3px 10px;font-size:12px;color:var(--muted);font-weight:600}
.star{position:absolute;left:50%;top:50%;opacity:0;animation:starBurst .8s ease-out forwards}
.zoom-flash{position:absolute;right:12px;top:10px;font-weight:700;color:var(--purple);font-size:15px;opacity:0;pointer-events:none}

/* numpad */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:var(--padw,300px);margin:0 auto;flex-shrink:0}
.num-btn{font-size:var(--kf,24px);font-weight:600;height:var(--key,50px);padding:0;border-radius:13px;border:none;background:white;color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.num-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.num-btn.back{font-size:calc(var(--kf,24px)*.82);background:var(--soft);color:var(--muted)}
.num-btn.submit{font-size:calc(var(--kf,24px)*.82);background:linear-gradient(135deg,var(--teal),var(--green));color:white;box-shadow:0 3px 0 #2d9e5a}
.next-btn{width:100%;max-width:var(--padw,300px);margin:0 auto;display:block;font-size:calc(var(--kf,24px)*.75);font-weight:600;height:calc(var(--key,50px)*1.15);padding:0 15px;border-radius:15px;border:none;background:linear-gradient(135deg,var(--orange2),var(--orange));color:white;box-shadow:0 4px 0 #c0771a,0 6px 16px rgba(230,126,34,.3);flex-shrink:0}
.next-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c0771a}

/* generic */
.section-title{font-size:14px;font-weight:700;margin-bottom:6px}
.box{background:white;border-radius:16px;border:2px solid var(--soft);padding:12px}
.h2 .e{-webkit-text-fill-color:initial;background:none}
.h2{font-size:23px;font-weight:700;text-align:center;background:linear-gradient(135deg,var(--orange),var(--orange2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.btn{font-weight:600;font-size:15px;border:none;border-radius:12px;padding:10px 14px;background:var(--soft);color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,var(--orange2),var(--orange));color:white;box-shadow:0 3px 0 #c0771a}
.btn.green{background:linear-gradient(135deg,var(--teal),var(--green));color:white;box-shadow:0 3px 0 #2d9e5a}
.btn.danger{background:#fce4e4;color:#c0392b;border:2px solid #f5c6c6}
.btn.small{font-size:13px;padding:6px 10px;border-radius:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* cats page */
.buddy-box{display:flex;align-items:center;gap:12px}
.badge-shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.badge-slot{aspect-ratio:1;border-radius:12px;background:#f8f0e3;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:18px}
.badge-slot.earned{border-style:solid;border-color:#f0d890;background:#fff8e7}
.badge-slot canvas{width:80%!important;height:80%!important}
.badge-label{position:absolute;bottom:1px;left:0;right:0;font-size:8px;color:var(--muted);text-align:center;background:rgba(255,255,255,.85)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.cat-cell{aspect-ratio:1;background:white;border-radius:12px;border:2px solid var(--soft);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0}
.cat-cell.buddy{border-color:var(--orange)}
.cat-cell .cat-label{position:absolute;bottom:2px;left:2px;right:2px;font-size:9px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-cell .buddy-star{position:absolute;top:2px;right:4px;font-size:11px}

/* shop */
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop-item{background:white;border:2px solid var(--soft);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.shop-item.wearing{border-color:var(--green)}
.shop-name{font-weight:700;font-size:14px}
.shop-price{font-size:13px;color:var(--muted)}
.fish-big{font-size:28px;font-weight:700;text-align:center}

/* shop extras */
.shop-prev{height:74px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.shop-prev .art{width:clamp(40px,calc(var(--w)*5px),110px)}
.shop-prev .art svg{max-height:74px;width:100%}
.shop-prev .emo{font-size:clamp(30px,calc(var(--w)*4.5px),58px);line-height:1}
.shop-item.legend{background:linear-gradient(160deg,#fffaf0,#fff1c9);border-color:#f3d37a}
.swatch{width:100%;height:64px;border-radius:10px;border:2px solid var(--soft);container-type:inline-size}
.mini-bar{width:80%;height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.mini-bar>div{height:100%;background:linear-gradient(90deg,#f39c12,#e67e22)}
body.big .shop-grid{grid-template-columns:repeat(3,1fr)}
/* room */
.room{position:relative;width:min(100%,calc(66vh*4/3));aspect-ratio:4/3;margin:0 auto;border-radius:18px;overflow:hidden;container-type:inline-size;border:3px solid #e8d6b8;flex-shrink:0;touch-action:pan-y}
.room-wall{position:absolute;left:0;right:0;top:0;height:60%}
.room-floor{position:absolute;left:0;right:0;top:60%;bottom:0}
.room-base{position:absolute;left:0;right:0;top:59%;height:1.6%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.08)}
.ritem{position:absolute;width:calc(var(--w)*1cqw);transform:translate(-50%,-100%);display:flex;justify-content:center;align-items:flex-end;cursor:pointer}
.ritem .art{width:100%}
.ritem .emo{font-size:calc(var(--w)*.9cqw);line-height:1;display:block}
.ritem .away{display:none;position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:none;background:#e74c3c;color:#fff;font-size:12px;line-height:24px;padding:0;z-index:2}
.room.editing .ritem{outline:2px dashed rgba(90,70,40,.35);outline-offset:2px;border-radius:6px;touch-action:none;cursor:grab}
.room.editing .ritem.sel .away{display:block}
.room.editing .ritem.sel{outline:3px solid #e67e22}
.ritem.dragging{outline-color:#e67e22!important;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.room-cat{position:absolute;transform:translate(-50%,-100%);transition:left 1.6s ease-in-out,top 1.6s ease-in-out;cursor:pointer}
.room-cat canvas{display:block}
.room-cat.walking canvas{animation:waddle .3s ease-in-out infinite alternate}
.room-fx{position:absolute;font-size:6cqw;z-index:200;pointer-events:none}
.room-empty{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:600;color:var(--muted);font-size:4cqw;padding:0 8%}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.tray-chip{display:flex;align-items:center;gap:6px;border:2px solid var(--soft);background:#fff;border-radius:12px;padding:4px 10px;font-weight:600;color:var(--ink);font-size:13px}
.tc-art{width:30px;display:flex;justify-content:center}.tc-art .art{width:30px}.tc-art .emo{font-size:24px}
/* stats */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:14px;color:var(--muted)}
.stat-val{font-weight:700;color:var(--ink)}
.bar{height:7px;border-radius:4px;background:var(--soft);margin-top:4px;overflow:hidden}
.bar>div{height:100%;border-radius:4px}
.fun-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fun-cell{background:#fff8e7;border-radius:12px;padding:8px;text-align:center}
.fun-cell .n{font-size:22px;font-weight:700}
.fun-cell .l{font-size:11px;color:var(--muted)}
.mastery{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin-top:6px}
.mcell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#5a4e3a}
.mcell.head{background:none;color:var(--muted);font-weight:700;font-size:11px}
.m-new{background:#efe9df;color:#b9ad98}.m-learn{background:#ffe08a}.m-tricky{background:#f8a5a5}.m-good{background:#9be3a8}
.mcell.out{opacity:.3}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:3px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tricky-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tricky-chip{background:#fde3e3;border-radius:10px;padding:4px 9px;font-weight:600;font-size:14px}
.seg{display:flex;gap:4px}
.seg button{flex:1;border:2px solid var(--line);background:white;border-radius:10px;padding:5px;font-weight:600;color:var(--muted);font-size:13px}
.seg button.active{border-color:var(--orange);color:#c0392b;background:#fff3e6}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(60,40,20,.45);padding:16px}
.overlay.open{display:flex}
.overlay.dialog{z-index:80}
.modal{background:white;border-radius:22px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;position:relative;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);-webkit-overflow-scrolling:touch}
.modal h3{font-size:20px;margin-bottom:6px;text-align:center}
.modal p{font-size:15px;color:var(--muted);text-align:center;line-height:1.35}
.modal .actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.close-x{position:absolute;top:6px;right:10px;border:none;background:none;font-size:24px;color:var(--faint);padding:4px}
.p-section{border-top:1px solid var(--soft);padding-top:12px;margin-top:12px}
.p-section:first-of-type{border-top:none;margin-top:0;padding-top:0}
.p-title{font-weight:700;font-size:15px;margin-bottom:6px}
.p-note{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.35}
.table-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.table-btn{height:38px;border-radius:10px;border:2px solid var(--line);background:white;font-size:16px;font-weight:700;color:var(--muted)}
.table-btn.active{border-color:var(--orange);background:linear-gradient(135deg,#ffecd2,#fcb69f);color:#c0392b}
.clip-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.clip-row .lbl{font-size:13px;width:92px}
.clip-row .btn{padding:6px 9px;font-size:13px}
.rec{background:#e74c3c!important;color:white!important;animation:pulse 1s infinite}
textarea.backup{width:100%;height:70px;border:2px solid var(--line);border-radius:10px;padding:6px;font-size:11px;resize:none;margin-top:6px}
.name-input{width:100%;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:12px;text-align:center;margin-top:8px}
#countdown{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;font-size:110px;font-weight:700;color:var(--purple);background:rgba(255,255,255,.6);pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(60,50,40,.9);color:white;padding:9px 16px;border-radius:14px;font-size:14px;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* prank stage */
#poopOverlay{position:fixed;inset:0;z-index:60;display:none;overflow:hidden;background:linear-gradient(#cfe8ff 0%,#eaf4ff 58%,#d9b98c 58%,#caa877 100%)}
#poopOverlay.open{display:block}
#poopOverlay.night{background:linear-gradient(#141a3a 0%,#2a2f5e 58%,#3b2f25 58%,#2e241c 100%)}
.poop-head{position:absolute;top:max(20px,env(safe-area-inset-top));left:0;right:0;z-index:8;pointer-events:none}
.poop-caption{text-align:center;font-size:clamp(22px,4.2vh,40px);font-weight:700;padding:0 16px;color:var(--ink);text-shadow:0 2px 0 white;z-index:8;line-height:1.15}
.poop-sub{margin-top:6px;text-align:center;font-size:clamp(14px,2.2vh,20px);color:var(--muted);padding:0 16px;z-index:8}
.night .poop-caption{color:#fff;text-shadow:0 2px 0 #000}
.night .poop-sub{color:#c9cbe8}
.dad{position:absolute;right:5%;bottom:7%;height:min(62%,76vw);aspect-ratio:200/340;z-index:2}
.dad.shocked{animation:shake .45s 3}
.bed{position:absolute;right:3%;bottom:6%;width:min(92vw,70vh);aspect-ratio:360/200;z-index:2}
.pc-walker{position:absolute;left:-999px;top:0;z-index:3}
.pc-walker canvas{display:block;width:100%!important;height:100%!important}
.pc-walker.walking canvas{animation:waddle .32s ease-in-out infinite alternate}
#walkerItem{position:absolute;left:50%;top:42%;transform:translateX(-50%);line-height:1;pointer-events:none}
@keyframes waddle{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
.poop-done{position:relative;margin:12px auto 0;width:auto;height:auto;padding:12px 30px;display:none;pointer-events:auto;font-size:clamp(16px,2.4vh,22px)}
.fly{position:absolute;font-size:clamp(22px,3vh,34px);z-index:7;animation:orbit 1.1s linear infinite;pointer-events:none}
@keyframes orbit{from{transform:translate(-50%,-50%) rotate(0deg) translateX(6vh) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg) translateX(6vh) rotate(-360deg)}}
.sky{position:absolute;font-size:clamp(40px,7vh,80px);opacity:.9;z-index:0}
.cloud{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(40px)}}
#skyMoon,#skyStars{display:none}
.night #skyMoon,.night #skyStars{display:block}
.night #skySun,.night .cloud{display:none}
.say-fx{font-weight:700;color:#c0392b;white-space:nowrap;text-shadow:0 2px 0 #fff}
.night .say-fx{color:#ffd166;text-shadow:0 2px 0 #000}
.prop{position:absolute;z-index:1}
.side-table{background:linear-gradient(#a0703c 0,#a0703c 12px,transparent 12px)}
.side-table::before,.side-table::after{content:'';position:absolute;top:12px;bottom:0;width:10px;background:#8a5d2f}
.side-table::before{left:10%}.side-table::after{right:10%}
.fancy-bed{border-radius:40% 40% 18px 18px;background:radial-gradient(ellipse at 50% 35%,#d7b8ff 0 38%,#9b6be0 40%,#7d4ac9 100%);border:3px solid #f1c40f;box-shadow:0 4px 0 #c99b00}
.price-tag{position:absolute;right:-8px;top:-14px;background:#fff;border:2px solid #e0a800;border-radius:6px;padding:0 5px;font-weight:700;font-size:13px;color:#b07d00;transform:rotate(12deg)}
.cbox{z-index:4;background:#c9a06a;border:3px solid #a57b45;border-radius:4px}
.cbox::before,.cbox::after{content:'';position:absolute;top:-16%;width:48%;height:22%;background:#d8b07a;border:3px solid #a57b45}
.cbox::before{left:-6%;transform:rotate(-18deg)}.cbox::after{right:-6%;transform:rotate(18deg)}
.hairball{border-radius:50%;background:radial-gradient(circle at 35% 35%,#a07850,#5b3d22 70%);box-shadow:0 0 0 3px rgba(91,61,34,.45)}
.hairpiece{background:#6b4a2f;border-radius:50% 50% 25% 25%}
.prank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.prank-tile{border:2px solid var(--soft);background:#fff8e7;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.prank-tile .pe{font-size:30px;line-height:1.1}
.prank-tile .pn{font-size:11px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2}
.prank-tile .pc{font-size:10px;color:var(--muted)}
.prank-tile.locked{background:#f3ede3;border-style:dashed}
.prank-tile.locked .pe{filter:grayscale(1);opacity:.5}

#mummy .mb{fill:#fbfbf6;stroke:#cfc9b8;stroke-width:2;display:none}
/* layout wrappers */
#page-play{overflow:hidden}
.play-left{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.play-right{flex-shrink:0}
@media (max-width:430px){ .nav-btn{font-size:12.5px} .pill{padding:3px 7px;font-size:13px} .icon-btn{padding:4px 7px} .mode-btn{padding:4px 7px} }
/* landscape: two columns */
body.land #app{max-width:1100px}
body.land #page-play.active{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:16px}
body.land #topBar{grid-column:1 / 3}
body.land .play-left{grid-column:1;grid-row:2}
body.land .play-right{grid-column:2;grid-row:2;display:flex;flex-direction:column;justify-content:center;padding-bottom:6px}
/* tablets */
body.big #app{max-width:660px}
body.big.land #app{max-width:1100px}
body.big .nav-btn{font-size:17px;padding:10px 2px}
body.big .pill,body.big .icon-btn,body.big .mode-btn{font-size:17px}
body.big .feedback{font-size:18px}
body.big .reward-name{font-size:20px} body.big .reward-traits{font-size:13px} body.big .reward-msg{font-size:24px} body.big .reward-eq{font-size:19px} body.big .reward-extra{font-size:15px} body.big .mini-btn{font-size:15px}
body.big .h2{font-size:30px} body.big .sub{font-size:14px} body.big .section-title{font-size:17px}
body.big .cat-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
/* animations */
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes starBurst{0%{transform:translate(-50%,-50%) translate(0,0) scale(0);opacity:1}100%{transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(1);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

<script>
'use strict';
// ============================================================
// UTILITIES
// ============================================================
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MAXN = 12;
const TOTAL_CATS = 3125;
let overlayCount = 0;

function commitLast(el, frames) {
  const last = frames[frames.length - 1];
  for (const k in last) if (k !== 'offset' && k !== 'easing') el.style[k] = last[k];
}
// Animate and keep the end state (committed to inline style)
function anim(el, frames, opts) {
  return new Promise(res => {
    if (!el.animate) { commitLast(el, frames); res(); return; }
    const a = el.animate(frames, Object.assign({ fill: 'forwards' }, opts));
    a.onfinish = () => { commitLast(el, frames); a.cancel(); res(); };
  });
}
// Transient animation (returns to normal afterwards)
function pulse(el, frames, opts) {
  if (!el.animate) return Promise.resolve();
  return new Promise(res => { const a = el.animate(frames, opts); a.onfinish = res; });
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function prep(canvas, w, h) {
  const d = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(w * d); canvas.height = Math.round(h * d);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return ctx;

// ============================================================
// PROBLEMS + TRICKY-FACT TRACKING
// ============================================================
let prob = null, input = '', phase = 'playing', lastKey = null;
function factKey(op, x, y) { return op + x + '_' + y; }
function fact(k) { return state.facts[k] || (state.facts[k] = { s: 0, c: 0, w: 0, n: 0 }); }
function factStatus(f) { if (!f || !f.n) return 'new'; if (f.s >= 3) return 'tricky'; if (f.c >= 2 && f.s === 0) return 'good'; return 'learn'; }
function chooseOp() { if (state.mode === 'multiply') return 'm'; if (state.mode === 'divide') return 'd'; return Math.random() < 0.5 ? 'm' : 'd'; }
function generateProblem() {
  const op = chooseOp(), cands = []; let tot = 0;
  for (let x = 1; x <= state.maxTable; x++) for (let y = 1; y <= MAXN; y++) {
    const k = factKey(op, x, y); if (k === lastKey) continue;
    const f = state.facts[k]; const w = !f ? 1.4 : 1 + f.s * 2 + (f.c < 2 ? 0.4 : 0);
    cands.push([x, y, k, w]); tot += w;
  }
  let r = Math.random() * tot, ch = cands[cands.length - 1];
  for (const c of cands) { r -= c[3]; if (r <= 0) { ch = c; break; } }
  const [x, y, k] = ch; lastKey = k;
  if (op === 'm') { const sw = Math.random() < 0.5; prob = { op: '×', a: sw ? y : x, b: sw ? x : y, answer: x * y, key: k, attempts: 0 }; }
  else prob = { op: '÷', a: x * y, b: x, answer: y, key: k, attempts: 0 };
}

const KNOCK_OBJS = [['🏺', 'the vase'], ['🥛', 'the milk'], ['🪴', 'the plant'], ['📱', "Dad's phone"], ['☕', "Dad's mug"], ['🥚', 'an egg'], ['🏆', 'the trophy'], ['🔮', 'the magic ball'], ['🍯', 'the honey jar'], ['🧁', 'the cupcake']];

const REWARDS = ['Purrfect! 🎉', 'Math cat-genius!', 'Meow-velous!', 'Claw-some!', 'Fur-tastic!', 'Nailed it, kitty!', 'Un-fur-gettable!', 'Cat-culating master!', 'Whisker-sharp!', "The cat's meow!", 'Hiss-torically great!', 'Feline fine! 🌟'];
const WRONGS = ['Almost! Try again 💪', 'So close!', 'Not quite — you got this!', 'Oops! One more try!', 'Keep going!'];
let zoom = null;
let pendingBadge = null;

function buddyId() { return Number.isInteger(state.buddy) ? state.buddy : 0; }
function catName(id) { return state.names[id] || ''; }

function buildNumpad() {
  const np = $('numpad');
  [1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].forEach(k => {
    const b = document.createElement('button');

    b.textContent = k;

    b.addEventListener('touchend', e => { e.preventDefault(); touched = true; handlePress(String(k)); });
    b.addEventListener('click', () => { if (touched) { touched = false; return; } handlePress(String(k)); });

  });

function renderInput(cls) {
  const d = $('answerDisplay');
  d.className = 'answer-display' + (cls ? ' ' + cls : '');

}
function setFeedback(text, hint) { const f = $('feedback'); f.textContent = text || ''; f.className = 'feedback' + (hint ? ' hint' : ''); }

function newProblem() {
  generateProblem(); input = ''; phase = 'playing';
  $('numA').textContent = prob.a; $('numB').textContent = prob.b; $('opSymbol').textContent = prob.op;
  renderInput(); setFeedback('');
  $('playView').style.display = 'flex'; $('rewardView').style.display = 'none';
  $('nextBtn').style.display = 'none'; $('numpadArea').style.display = 'block';
  $('starContainer').innerHTML = '';
}

function handlePress(key) {
  if (overlayCount) return;
  if (phase === 'correct') { if (key === '✓' && !zoom) advance(); return; }
  if (key === '⌫') { input = input.slice(0, -1); if (phase === 'wrong') phase = 'playing'; renderInput(); return; }
  if (key === '✓') { if (input) submit(); return; }
  if (phase === 'wrong') { input = ''; phase = 'playing'; }
  if (input.length < 3) { input += key; renderInput(); }
}

function submit() {
  const val = parseInt(input, 10), f = fact(prob.key), isMul = prob.op === '×';
  if (prob.attempts === 0) { f.n++; if (isMul) state.totalMul++; else state.totalDiv++; }
  if (val === prob.answer) {
    if (prob.attempts === 0) { f.c++; f.s = Math.max(0, f.s - 1); if (isMul) state.correctMul++; else state.correctDiv++; }
    onCorrect();
  } else {
    f.w++; f.s = Math.min(6, f.s + (prob.attempts === 0 ? 2 : 1)); prob.attempts++;
    onWrong();
  }
  save();
}

function onWrong() {
  state.streak = 0; phase = 'wrong'; Sound.wrong();
  renderInput('wrong');
  if (prob.attempts >= 2) setFeedback(`Psst… it's ${prob.answer}. Type it in!`, true);
  else setFeedback(pick(WRONGS));
  const card = $('card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  updateHUD();
}

function collectCat() {
  let id;
  if (collectedSet.size >= TOTAL_CATS) id = Math.floor(Math.random() * TOTAL_CATS);
  else { do { id = Math.floor(Math.random() * TOTAL_CATS); } while (collectedSet.has(id)); state.catsCollected.push(id); collectedSet.add(id); }
  const n = state.catsCollected.length;
  const b = BADGES.findIndex(x => x.need === n);
  if (b >= 0) pendingBadge = b;
  return id;
}

function onCorrect() {
  phase = 'correct';
  state.streak++; if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  const catId = collectCat();
  const fishGain = zoom ? 2 : 1;
  state.fish += fishGain; state.fishEarned += fishGain;
  state.meter = Math.min(10, state.meter + 1);
  if (state.meter >= 10) state.poopPending = true;
  if (!zoom) state.bossCounter++;
  save();
  Sound.correct();

  if (zoom) {
    zoom.count++;
    renderInput('right');
    const zf = $('zoomFlash'); zf.textContent = `+🐱 +${fishGain}🐟`;
    pulse(zf, [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-16px)' }], { duration: 650 });
    updateHUD();
    setTimeout(() => { if (zoom) newProblem(); }, 260);
    return;
  }

  // scene effects
  knockStep();
  if (state.boss) bossHit();
  else maybeSpawnBoss();
  if (state.streak > 0 && state.streak % 5 === 0) { setTimeout(() => { sceneMsg(`🔥 ${state.streak} in a row!`); Sound.coin(); }, 900); }
  if (state.poopPending) setTimeout(() => sceneMsg('Buddy is SO full… uh oh 😳', 2400), 500);

  showReward(catId, fishGain);
  updateHUD();
}

function sceneK() { return parseFloat($('scene').style.getPropertyValue('--k')) || 1; }
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  const land = w > h && w >= 560;
  const big = Math.min(w, h) >= 600;
  document.body.classList.toggle('land', land);
  document.body.classList.toggle('big', big);
  let k, key, eq, padw;
  if (land) {
    k = clampN((h - 110) * 0.42 / 150, 0.55, 1.5);
    key = clampN((h - 140) / 4.6, 40, 92);
    eq = clampN(h * 0.085, 30, 80);
    padw = Math.min(460, key * 4.2);
  } else {
    k = clampN(Math.min(w / 360, h * 0.2 / 150), 0.7, 1.6);
    key = clampN(h * 0.075, 40, 80);
    eq = clampN(h * 0.062, 32, 80);
    padw = big ? 420 : 340;
  }
  const r = document.documentElement.style;
  r.setProperty('--key', key + 'px'); r.setProperty('--kf', Math.round(key * 0.46) + 'px');
  r.setProperty('--eq', eq + 'px'); r.setProperty('--ans', Math.round(eq * 0.82) + 'px'); r.setProperty('--padw', padw + 'px');
  $('scene').style.setProperty('--k', k.toFixed(3));

}

function choosePrank() {
  const c = PRANKS.filter(p => p.id !== state.lastPrank);
  const w = c.map(p => (state.pranksSeen[p.id] ? 1 : 3));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < c.length; i++) { r -= w[i]; if (r <= 0) return c[i]; }
  return c[c.length - 1];
}
async function runPrank(id, replay) {
  const p = PRANKS.find(x => x.id === id) || PRANKS[0];
  overlayCount++;
  dadReset(); $('poopDone').style.display = 'none'; cap(''); sub('');
  STAGE().classList.add('open');
  await sleep(60);
  try { await p.run(); } catch (e) { console.error(e); }
  if (!replay) {
    state.dadPooped++; state.pranksSeen[p.id] = (state.pranksSeen[p.id] || 0) + 1; state.lastPrank = p.id;
    state.meter = 0; state.poopPending = false; save();
  }
  const fresh = !replay && state.pranksSeen[p.id] === 1;
  sub(replay ? `Replay: ${p.emoji} ${p.name}` : `${fresh ? `🆕 New prank: ${p.name}! • ` : ''}Dad has been pranked ${state.dadPooped} ${state.dadPooped === 1 ? 'time' : 'times'}!`);
  await sleep(800);
  $('poopDone').style.display = 'block';
  await new Promise(res => { $('poopDone').onclick = res; });
  STAGE().classList.remove('open');
  dadReset();
  overlayCount--;
  updateHUD();
}

function openDialog(html, buttons) {
  return new Promise(res => {
    const ov = $('dialog'), box = $('dialogBox');
    box.innerHTML = html;
    const acts = document.createElement('div'); acts.className = 'actions';
    buttons.forEach(b => {
      const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
      el.addEventListener('click', () => { ov.classList.remove('open'); overlayCount--; res(b.value); });
      acts.appendChild(el);
    });
    box.appendChild(acts);
    overlayCount++; ov.classList.add('open');
  });
}
const uiAlert = (title, msg) => openDialog(`<h3>${title}</h3><p>${msg}</p>`, [{ label: 'OK', cls: 'primary', value: true }]);

function askName(catId) {

const itemDef = id => ROOM_ITEMS.find(x => x.id === id);
function roomValue() {
  const r = state.room;
  return r.items.reduce((a, it) => a + (itemDef(it.id) ? itemDef(it.id).price : 0), 0)
    + r.styles.reduce((a, k) => { const [t, id] = k.split(':'); const d = (t === 'wall' ? WALLS : FLOORS).find(x => x.id === id); return a + (d ? d.price : 0); }, 0);
}
function roomRank() {
  const v = roomValue(); let i = 0;
  while (i + 1 < RANKS.length && v >= RANKS[i + 1][0]) i++;
  return { v, i, name: RANKS[i][1], next: RANKS[i + 1] || null, prev: RANKS[i][0] };
}
function defaultSpot(def) {
  if (def.place === 'wall') return { x: 12 + Math.random() * 76, y: 22 + Math.random() * 28 };
  if (def.place === 'rug') return { x: 50, y: 93 };
  return { x: 8 + Math.random() * 84, y: 70 + Math.random() * 26 };
}
function addRoomItem(id) {
  const def = itemDef(id), s = defaultSpot(def);
  state.room.items.push({ u: state.room.nextUid++, id, x: Math.round(s.x * 10) / 10, y: Math.round(s.y * 10) / 10, out: false });
}
function itemArtHTML(def) { return def.art ? `<div class="art">${ART[def.art]}</div>` : `<span class="emo">${def.emoji}</span>`; }

let roomEditing = false, roomCatTimer = null;
function renderRoom() {
  const el = $('roomInner'); el.innerHTML = '';
  const r = state.room, rk = roomRank();
  const pctNext = rk.next ? Math.round((rk.v - rk.prev) / (rk.next[0] - rk.prev) * 100) : 100;
  el.insertAdjacentHTML('beforeend', `<div><div class="h2"><span class="e">🏠</span> ${esc(catName(buddyId()) || 'Buddy')}'s Room</div>
    <div class="sub">Level: <b>${rk.name}</b> • coziness ${rk.v}${rk.next ? ` / ${rk.next[0]} to <b>${rk.next[1]}</b>` : ' — MAXED OUT! 👑'}</div>
    <div class="bar" style="max-width:340px;margin:6px auto 0"><div style="width:${pctNext}%;background:linear-gradient(90deg,#f39c12,#e67e22)"></div></div></div>`);
  const ctl = document.createElement('div'); ctl.className = 'row'; ctl.style.justifyContent = 'center';

  eb.onclick = () => { roomEditing = !roomEditing; renderRoom(); };
  const sb = document.createElement('button'); sb.className = 'btn small primary'; sb.textContent = '🛍️ Shop for more';
  sb.onclick = () => { shopTab = 'room'; goPage('shop'); };
  ctl.appendChild(eb); ctl.appendChild(sb); el.appendChild(ctl);
  if (roomEditing) el.insertAdjacentHTML('beforeend', '<div class="sub">Tap something to pick it (it jumps to the front), then drag it around. Tap its ✖ to put it in storage.</div>');

  const room = document.createElement('div'); room.className = 'room' + (roomEditing ? ' editing' : ''); room.id = 'room';
  const wall = WALLS.find(w => w.id === r.wall) || WALLS[0], floor = FLOORS.find(f => f.id === r.floor) || FLOORS[0];
  room.innerHTML = `<div class="room-wall" style="background:${wall.css}"></div><div class="room-floor" style="background:${floor.css}"></div><div class="room-base"></div>`;
  r.items.filter(it => !it.out).forEach(it => room.appendChild(buildRoomItem(it)));
  const cw = document.createElement('div'); cw.className = 'room-cat'; cw.id = 'roomCat';
  cw.innerHTML = '<canvas></canvas>'; room.appendChild(cw);
  el.appendChild(room);
  if (!r.items.length) room.insertAdjacentHTML('beforeend', `<div class="room-empty">It's empty in here! 🥺<br>Earn 🐟 and buy Buddy some stuff in the Shop.</div>`);

  // storage tray
  const out = r.items.filter(it => it.out);
  if (out.length) {
    const tr = document.createElement('div'); tr.className = 'box';
    tr.innerHTML = '<div class="section-title">📦 In storage — tap to put back</div>';
    const row = document.createElement('div'); row.className = 'tray';
    out.forEach(it => {
      const d = itemDef(it.id), b = document.createElement('button'); b.className = 'tray-chip';
      b.innerHTML = `<span class="tc-art" style="--w:${d.w}">${itemArtHTML(d)}</span><span>${d.name}</span>`;
      b.onclick = () => { it.out = false; const s = defaultSpot(d); it.x = s.x; it.y = s.y; save(); Sound.pop(); renderRoom(); };
      row.appendChild(b);
    });
    tr.appendChild(row); el.appendChild(tr);
  }
  requestAnimationFrame(() => { sizeRoomCat(); roomCatStart(); });
}
function buildRoomItem(it) {
  const d = itemDef(it.id);
  const e = document.createElement('div'); e.className = 'ritem' + (d.place === 'rug' ? ' rug' : ''); e.dataset.u = it.u;
  e.style.setProperty('--w', d.w); e.style.left = it.x + '%'; e.style.top = it.y + '%';
  e.style.zIndex = d.place === 'rug' ? 2 : 10 + Math.round(it.y);
  e.innerHTML = itemArtHTML(d) + '<button class="away" aria-label="Put away">✖</button>';
  e.querySelector('.away').addEventListener('click', ev => { ev.stopPropagation(); it.out = true; save(); renderRoom(); });
  e.addEventListener('click', () => {
    if (roomEditing) return;
    pulse(e, [{ transform: 'translate(-50%,-100%) scale(1)' }, { transform: 'translate(-50%,-100%) scale(1.15,.9)' }, { transform: 'translate(-50%,-100%) scale(1)' }], { duration: 300 });
    Sound.pop();
    if (d.use) roomCatGo(it);
  });
  // dragging in edit mode
  e.addEventListener('pointerdown', ev => {
    if (!roomEditing || ev.target.classList.contains('away')) return;
    ev.preventDefault(); try { e.setPointerCapture(ev.pointerId); } catch (er) {}
    $('room').querySelectorAll('.ritem.sel').forEach(o => { o.classList.remove('sel'); const oi = state.room.items.find(i => i.u == o.dataset.u); if (oi) o.style.zIndex = itemDef(oi.id).place === 'rug' ? 2 : 10 + Math.round(oi.y); });
    e.classList.add('sel', 'dragging'); e.style.zIndex = 900;
    const rr = $('room').getBoundingClientRect();
    const ox = (ev.clientX - rr.left) / rr.width * 100 - it.x, oy = (ev.clientY - rr.top) / rr.height * 100 - it.y;
    const move = m => {
      it.x = clampN((m.clientX - rr.left) / rr.width * 100 - ox, 3, 97);
      it.y = clampN((m.clientY - rr.top) / rr.height * 100 - oy, 10, 99);
      e.style.left = it.x + '%'; e.style.top = it.y + '%';
    };
    const up = () => { e.removeEventListener('pointermove', move); e.removeEventListener('pointerup', up); e.removeEventListener('pointercancel', up); e.classList.remove('dragging'); it.x = Math.round(it.x * 10) / 10; it.y = Math.round(it.y * 10) / 10; save(); };
    e.addEventListener('pointermove', move); e.addEventListener('pointerup', up); e.addEventListener('pointercancel', up);
  });
  return e;
}

const USE_FX = { sleep: '💤', eat: '😋', drink: '💧', play: '⭐', scratch: '✨', potty: '🙈', sit: '😺', watch: '👀' };
let roomCatPos = { x: 50, y: 88 };
function sizeRoomCat() {
  const room = $('room'), cw = $('roomCat'); if (!room || !cw) return;
  const sz = Math.round(room.clientWidth * 0.16);
  drawFullCat(cw.querySelector('canvas'), buddyId(), sz, { fat: state.meter / 10, hat: state.hat });
  cw.style.left = roomCatPos.x + '%'; cw.style.top = roomCatPos.y + '%'; cw.style.zIndex = 10 + Math.round(roomCatPos.y) + 1;
  cw.onclick = () => { Sound.meow(); roomFx('💕', roomCatPos.x, roomCatPos.y - 14); };
  cw.style.display = roomEditing ? 'none' : '';
}
function roomFx(t, x, y) {
  const room = $('room'); if (!room) return;
  const f = document.createElement('div'); f.className = 'room-fx'; f.textContent = t; f.style.left = x + '%'; f.style.top = y + '%';
  room.appendChild(f);
  pulse(f, [{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 0 }, { transform: 'translate(-50%,-90%) scale(1.1)', opacity: 1, offset: .3 }, { transform: 'translate(-50%,-200%) scale(1)', opacity: 0 }], { duration: 1500 }).then(() => f.remove());
}
function roomCatGo(it) {
  const room = $('room'), cw = $('roomCat'); if (!room || !cw || roomEditing) return;
  let x, y, z, fx = null;
  if (it) {
    const d = itemDef(it.id), node = room.querySelector(`.ritem[data-u="${it.u}"]`);
    const ih = node ? node.offsetHeight / room.clientHeight * 100 : 10;
    if (d.place === 'wall') { x = it.x; y = 96; }
    else if (d.perch) { x = it.x; y = it.y - ih * d.perch + 2; }
    else { x = clampN(it.x + (it.x > 50 ? -9 : 9), 6, 94); y = Math.max(it.y, 66); }
    z = (d.perch ? 10 + Math.round(it.y) + 1 : 10 + Math.round(y) + 1);
    fx = d.use ? (d.use === 'play' && d.emoji ? d.emoji : USE_FX[d.use]) : '❤️';
  } else { x = 10 + Math.random() * 80; y = 70 + Math.random() * 26; z = 10 + Math.round(y) + 1; }
  cw.style.zIndex = Math.max(z, 10 + Math.round(roomCatPos.y) + 1);
  cw.classList.add('walking');
  cw.style.left = x + '%'; cw.style.top = y + '%';
  roomCatPos = { x, y };
  clearTimeout(roomCatGo._t);
  roomCatGo._t = setTimeout(() => {
    cw.classList.remove('walking'); cw.style.zIndex = z;
    if (fx) roomFx(fx, x, y - 16);
    if (fx === '💤') { setTimeout(() => roomFx('💤', x + 3, y - 18), 900); }
  }, 1700);
}
function roomCatStart() {
  clearTimeout(roomCatTimer);
  const tick = () => {
    if (currentPage !== 'room' || !$('room')) return;
    if (!roomEditing && !overlayCount) {
      const usable = state.room.items.filter(it => !it.out && itemDef(it.id).use);
      roomCatGo(usable.length && Math.random() < 0.7 ? pick(usable) : null);
    }
    roomCatTimer = setTimeout(tick, 3800 + Math.random() * 2500);
  };
  roomCatTimer = setTimeout(tick, 900);
}

      const grid = document.createElement('div'); grid.className = 'shop-grid';
      ROOM_ITEMS.filter(d => d.tier === t).forEach(d => {
        const n = state.room.items.filter(i => i.id === d.id).length;
        const it = document.createElement('div'); it.className = 'shop-item' + (n && !d.multi ? ' wearing' : '') + (t === 3 ? ' legend' : '');
        it.insertAdjacentHTML('beforeend', `<div class="shop-prev" style="--w:${d.w}">${itemArtHTML(d)}</div><div class="shop-name">${d.name}</div>`);
        if (n && !d.multi) it.insertAdjacentHTML('beforeend', '<div class="shop-price">✓ In the room</div>');
        else {
          if (n) it.insertAdjacentHTML('beforeend', `<div class="shop-price">You have ${n}</div>`);
          it.insertAdjacentHTML('beforeend', priceLine(d.price));
          it.appendChild(buyBtn(d.price, () => { addRoomItem(d.id); toast(`🏠 ${d.name} added to Buddy's room!`); }));
        }
        grid.appendChild(it);
      });
      sec.appendChild(grid); el.appendChild(sec);
    });
  }
}

// ============================================================
// STATS
// ============================================================
let gridOp = 'm';
function pct(c, t) { return t ? Math.round(c / t * 100) : 0; }
function barColor(p) { return p >= 80 ? '#44bd60' : p >= 50 ? '#f5a623' : '#eb3b5a'; }
function renderStats() {
  const el = $('statsInner'), s = state;
  const tot = s.totalMul + s.totalDiv, cor = s.correctMul + s.correctDiv;
  const card = (title, c, t) => `<div class="box"><div class="section-title">${title}</div>
    <div class="stat-row"><span>Problems</span><span class="stat-val">${t}</span></div>
    <div class="stat-row"><span>Right on the first try</span><span class="stat-val">${c} (${pct(c, t)}%)</span></div>
    <div class="bar"><div style="width:${pct(c, t)}%;background:${barColor(pct(c, t))}"></div></div></div>`;
  el.innerHTML = `<div class="h2"><span class="e">📊</span> Stats</div>
    <div class="box"><div class="fun-grid">
      <div class="fun-cell"><div class="n">😹 ${s.dadPooped}</div><div class="l">Dad pranked</div></div>
      <div class="fun-cell"><div class="n">💥 ${s.broken}</div><div class="l">Things broken</div></div>
      <div class="fun-cell"><div class="n">🐶 ${s.dogsBonked}</div><div class="l">Puppy playdates</div></div>
      <div class="fun-cell"><div class="n">⚡ ${s.zoomBest}</div><div class="l">Zoomies record</div></div>
      <div class="fun-cell"><div class="n">🔥 ${s.bestStreak}</div><div class="l">Best streak</div></div>
      <div class="fun-cell"><div class="n">🐟 ${s.fishEarned}</div><div class="l">Fish earned</div></div>
    </div></div>
    ${card('Overall', cor, tot)}${card('✕ Times', s.correctMul, s.totalMul)}${card('÷ Divide', s.correctDiv, s.totalDiv)}`;

  // Dad pranks collection
  const seenN = PRANKS.filter(p => s.pranksSeen[p.id]).length;
  const pb = document.createElement('div'); pb.className = 'box';
  pb.innerHTML = `<div class="section-title">🎬 Dad Pranks (${seenN}/${PRANKS.length})</div><div class="sub" style="text-align:left">Fill Buddy's food bowl to see one. Tap one you've unlocked to watch it again!</div>`;
  const pg = document.createElement('div'); pg.className = 'prank-grid';
  PRANKS.forEach(p => {
    const n = s.pranksSeen[p.id] || 0;
    const t = document.createElement('button'); t.className = 'prank-tile' + (n ? '' : ' locked');
    t.innerHTML = n ? `<span class="pe">${p.emoji}</span><span class="pn">${p.name}</span><span class="pc">seen ×${n}</span>` : '<span class="pe">❓</span><span class="pn">???</span><span class="pc">locked</span>';
    if (n) t.onclick = () => runPrank(p.id, true).then(renderStats);
    pg.appendChild(t);
  });
  pb.appendChild(pg);
  el.children[1].after(pb);

  // mastery grid
  const mb = document.createElement('div'); mb.className = 'box';
  mb.innerHTML = `<div class="section-title">🧠 Facts map</div><div class="seg"><button data-op="m">✕ Times</button><button data-op="d">÷ Divide</button></div>`;
  mb.querySelectorAll('.seg button').forEach(b => { b.classList.toggle('active', b.dataset.op === gridOp); b.onclick = () => { gridOp = b.dataset.op; renderStats(); }; });
  const g = document.createElement('div'); g.className = 'mastery';
  const head = t => `<div class="mcell head">${t}</div>`;
  let html = head(gridOp === 'm' ? '×' : '÷');
  for (let y = 1; y <= MAXN; y++) html += head(y);
  for (let x = 1; x <= MAXN; x++) {
    html += head(x);
    for (let y = 1; y <= MAXN; y++) {
      const st = factStatus(s.facts[factKey(gridOp, x, y)]);
      const label = gridOp === 'm' ? x * y : y;
      const cls = { new: 'm-new', learn: 'm-learn', tricky: 'm-tricky', good: 'm-good' }[st];
      html += `<div class="mcell ${cls}${x > s.maxTable ? ' out' : ''}">${label}</div>`;
    }
  }
  g.innerHTML = html; mb.appendChild(g);
  mb.insertAdjacentHTML('beforeend', `<div class="legend"><span><i class="m-good"></i>Got it</span><span><i class="m-learn"></i>Learning</span><span><i class="m-tricky"></i>Tricky</span><span><i class="m-new"></i>Not tried</span></div>
    <div class="sub" style="text-align:left;margin-top:4px">${gridOp === 'm' ? 'Row × column. ' : 'Row = the number you divide by; the cell shows the answer. '}Faded rows are above the current table setting. Tricky facts show up more often until they're learned.</div>`);
  el.appendChild(mb);

  // tricky list
  const tricky = Object.entries(s.facts).filter(([, f]) => f.s >= 2).sort((a, b) => b[1].s - a[1].s).slice(0, 8);
  const tb = document.createElement('div'); tb.className = 'box';
  tb.innerHTML = '<div class="section-title">🎯 Tricky ones right now</div>';
  if (!tricky.length) tb.insertAdjacentHTML('beforeend', '<div class="sub" style="text-align:left">Nothing tricky right now! 🎉</div>');
  else {
    const l = document.createElement('div'); l.className = 'tricky-list';
    tricky.forEach(([k]) => {
      const op = k[0], [x, y] = k.slice(1).split('_').map(Number);
      l.insertAdjacentHTML('beforeend', `<span class="tricky-chip">${op === 'm' ? `${x} × ${y}` : `${x * y} ÷ ${x}`}</span>`);
    });
    tb.appendChild(l);
  }
  el.appendChild(tb);
}

// ============================================================
// GROWN-UP CORNER
// ============================================================
let rec = null;
function openParent() {
  openModal(box => {
    box.insertAdjacentHTML('beforeend', '<h3>⚙️ Grown-up corner</h3>');
    // tables
    const t = document.createElement('div'); t.className = 'p-section';
    t.innerHTML = `<div class="p-title">Times tables up to</div><div class="p-note">Problems use tables 1–N, times 1–12.</div>`;
    const tg = document.createElement('div'); tg.className = 'table-grid';
    for (let i = 1; i <= MAXN; i++) {
      const b = document.createElement('button'); b.className = 'table-btn' + (i === state.maxTable ? ' active' : ''); b.textContent = i;
      b.onclick = () => { state.maxTable = i; save(); tg.querySelectorAll('.table-btn').forEach(x => x.classList.toggle('active', +x.textContent === i)); if (!zoom) newProblem(); };
      tg.appendChild(b);
    }
    t.appendChild(tg); box.appendChild(t);

    // dad clips
    const d = document.createElement('div'); d.className = 'p-section';
    d.innerHTML = `<div class="p-title">🎙 Dad's reaction sounds</div><div class="p-note">Record up to 3 short clips (5 seconds max), like "NOOOO!" or "Not again!". One plays at random when Buddy pranks Dad. With none recorded, the iPad's built-in voice says something instead. Clips stay on this device only.</div>`;
    const clips = Clips.list();
    for (let i = 0; i < 3; i++) {
      const row = document.createElement('div'); row.className = 'clip-row';
      const recording = rec && rec.slot === i;
      row.insertAdjacentHTML('beforeend', `<span class="lbl">Clip ${i + 1}: ${clips[i] ? '✅' : '—'}</span>`);
      const rb = document.createElement('button'); rb.className = 'btn' + (recording ? ' rec' : '');
      rb.textContent = recording ? '⏹ Stop' : '🎙 Record';
      rb.disabled = !!rec && !recording;
      rb.onclick = () => recording ? stopRecording() : startRecording(i);
      row.appendChild(rb);
      if (clips[i]) {
        const pb = document.createElement('button'); pb.className = 'btn'; pb.textContent = '▶';
        pb.onclick = async () => { Sound.init(); try { const b = await new Promise((res, rej) => Sound.ctx.decodeAudioData(dataUrlToBuf(clips[i]), res, rej)); Sound.playBuf(b); } catch (e) { uiAlert('Hmm', "That clip couldn't be played on this device."); } };
        const db = document.createElement('button'); db.className = 'btn'; db.textContent = '🗑';
        db.onclick = () => { Clips.set(i, null); Sound.loadDad(); openParent(); };
        row.appendChild(pb); row.appendChild(db);
      }
      const fl = document.createElement('label'); fl.className = 'btn'; fl.textContent = '📁 File'; fl.style.cursor = 'pointer';
      const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'audio/*'; fi.style.display = 'none';
      fi.onchange = () => { if (fi.files && fi.files[0]) saveClipBlob(i, fi.files[0]); };
      fl.appendChild(fi); row.appendChild(fl);
      d.appendChild(row);
    }
    const tp = document.createElement('button'); tp.className = 'btn'; tp.textContent = '🎬 Test a random prank';
    tp.onclick = async () => { closeModal(); await runPrank(pick(PRANKS).id, true); };
    d.appendChild(tp); box.appendChild(d);

    // backup
    const bk = document.createElement('div'); bk.className = 'p-section';
    bk.innerHTML = `<div class="p-title">💾 Backup & restore</div><div class="p-note">Progress is saved on this device. The iPad app and the website keep separate copies. To move progress, copy the backup code here and paste it on the other one.</div>`;
    const ta = document.createElement('textarea'); ta.className = 'backup'; ta.placeholder = 'Backup code appears here, or paste one to restore';
    const r1 = document.createElement('div'); r1.className = 'row'; r1.style.marginTop = '6px';
    const cb = document.createElement('button'); cb.className = 'btn small'; cb.textContent = 'Make backup code';
    cb.onclick = () => {
      ta.value = btoa(unescape(encodeURIComponent(JSON.stringify(state)))); ta.focus(); ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => toast('Copied!'), () => toast('Select the text and copy it'));
      else toast('Select the text and copy it');
    };
    const rb = document.createElement('button'); rb.className = 'btn small'; rb.textContent = 'Restore from code';
    rb.onclick = async () => {
      let s;
      try { s = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim())))); } catch (e) { uiAlert('Hmm', "That code doesn't look right."); return; }
      if (!s || s.version !== 3 || !Array.isArray(s.catsCollected)) { uiAlert('Hmm', "That code doesn't look right."); return; }
      if (await uiConfirm('Restore?', `This replaces current progress with a backup that has ${s.catsCollected.length} cats.`, 'Restore')) {
        state = Object.assign(defaultState(), s); collectedSet = new Set(state.catsCollected); save(); updateHUD(); placeKnockObj(); newProblem(); closeModal(); toast('Restored!');
      }
    };
    r1.appendChild(cb); r1.appendChild(rb); bk.appendChild(ta); bk.appendChild(r1); box.appendChild(bk);

    // reset
    const rs = document.createElement('div'); rs.className = 'p-section';
    const rbtn = document.createElement('button'); rbtn.className = 'btn danger'; rbtn.style.width = '100%'; rbtn.textContent = '🗑 Reset ALL progress';
    rbtn.onclick = async () => {
      if (!await uiConfirm('Reset everything?', 'This deletes all cats, hats, fish and stats. It cannot be undone. (Dad clips are kept.)', 'Reset', true)) return;
      if (!await uiConfirm('Really sure?', `${state.catsCollected.length} cats will be gone forever.`, 'Yes, reset', true)) return;
      const keep = { sound: state.sound, maxTable: state.maxTable };
      state = Object.assign(defaultState(), keep); collectedSet = new Set(); save(); updateHUD(); placeKnockObj(); newProblem(); closeModal();
    };
    rs.appendChild(rbtn); box.appendChild(rs);
  });
}
async function startRecording(slot) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    uiAlert('No microphone here', 'Recording is not available in this browser. Use "📁 File" with a clip from Voice Memos instead.'); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const opts = (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4')) ? { mimeType: 'audio/mp4' } : {};
    const mr = new MediaRecorder(stream, opts), chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const s = rec ? rec.slot : slot; rec = null;
      saveClipBlob(s, new Blob(chunks, { type: mr.mimeType || 'audio/mp4' }));
    };
    mr.start();
    rec = { mr, slot, timer: setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 5000) };
    openParent();
  } catch (err) {
    rec = null;
    uiAlert('Microphone blocked', 'Could not use the microphone (' + esc(err.message || err.name) + '). You can use "📁 File" with a clip from Voice Memos instead.');
  }
}
function stopRecording() { if (rec) { clearTimeout(rec.timer); if (rec.mr.state === 'recording') rec.mr.stop(); } }
function saveClipBlob(slot, blob) {
  if (blob.size > 700000) { uiAlert('Too long', 'Keep clips under about 5 seconds.'); return; }
  const fr = new FileReader();
  fr.onload = async () => {
    if (!Clips.set(slot, fr.result)) { uiAlert('Out of space', 'Not enough storage for that clip.'); return; }
    await Sound.loadDad();
    if ($('modal').classList.contains('open')) openParent();
    toast('Clip saved!');
  };
  fr.readAsDataURL(blob);
}

// ============================================================
// NAV + INIT
// ============================================================
let currentPage = 'play';
function refreshPage() { if (currentPage === 'cats') renderCats(); else if (currentPage === 'room') renderRoom(); else if (currentPage === 'shop') renderShop(); else if (currentPage === 'stats') renderStats(); }
function goPage(pg) { const b = document.querySelector(`.nav-btn[data-page="${pg}"]`); if (b) b.click(); }
document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => {
  currentPage = btn.dataset.page;
  if (currentPage !== 'room') { roomEditing = false; clearTimeout(roomCatTimer); }
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + currentPage));
  if (currentPage === 'cats') catsShown = 60;
  refreshPage();
  if (currentPage === 'play') updateHUD();
}));
document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.mode; save(); updateHUD(); if (phase !== 'correct') newProblem(); }));
$('nextBtn').addEventListener('click', advance);
$('zoomBtn').addEventListener('click', startZoomies);
$('muteBtn').addEventListener('click', () => { state.sound = !state.sound; save(); updateHUD(); if (state.sound) { Sound.init(); Sound.pop(); } else { try { speechSynthesis.cancel(); } catch (e) {} } });
(() => {
  const g = $('gearBtn'); let ht = null;
  const cancel = () => { if (ht) { clearTimeout(ht); ht = null; g.classList.remove('holding'); toast('Grown-ups: press and hold ⚙️'); } };
  g.addEventListener('pointerdown', () => { if (overlayCount) return; g.classList.add('holding'); ht = setTimeout(() => { ht = null; g.classList.remove('holding'); openParent(); }, 1200); });
  g.addEventListener('pointerup', cancel); g.addEventListener('pointercancel', cancel); g.addEventListener('pointerleave', () => { if (ht) cancel(); });
  g.addEventListener('contextmenu', e => e.preventDefault());
})();
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => {
  if (overlayCount || currentPage !== 'play') return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key >= '0' && e.key <= '9') handlePress(e.key);
  else if (e.key === 'Backspace') { e.preventDefault(); handlePress('⌫'); }
  else if (e.key === 'Enter') { e.preventDefault(); handlePress('✓'); }
});

buildNumpad();
layout();
placeKnockObj();
updateHUD();
newProblem();
if (!state.welcomed) {
  state.welcomed = true; save();
  uiAlert('😺 New Math Cats!', `Your ${state.catsCollected.length} cats came with you!<br><br>New stuff: tables up to 12, a hungry buddy cat, a hat shop, playful puppies, ⚡ Zoomies… and something VERY silly happens to Dad when your buddy eats too much.<br><br>Here's <b>${state.fish} 🐟</b> to spend in the Shop!`);
}
</script>
